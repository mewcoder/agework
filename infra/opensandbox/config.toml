[server]
host = "0.0.0.0"
port = 8080

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.18"

[egress]
image = "opensandbox/egress:v1.1.0"

[docker]
network_mode = "bridge"
host_ip = "127.0.0.1"
drop_capabilities = [
  "AUDIT_WRITE",
  "MKNOD",
  "NET_ADMIN",
  "NET_RAW",
  "SYS_ADMIN",
  "SYS_MODULE",
  "SYS_PTRACE",
  "SYS_TIME",
  "SYS_TTY_CONFIG",
]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[storage]
allowed_host_paths = ["/Users/mew/.agework/workspaces"]
