name: Server

on:
  pull_request:
  push:
    branches:
      - main
      - refactor

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agework/adapters typecheck
      - run: pnpm --filter @agework/worker typecheck
      - run: pnpm --filter @agework/runtime typecheck
      - run: pnpm --filter server typecheck
      - run: pnpm --filter server lint
      - run: pnpm --filter @agework/adapters test
      - run: pnpm --filter @agework/worker test
      - run: pnpm --filter @agework/runtime test
      - run: pnpm test:server
